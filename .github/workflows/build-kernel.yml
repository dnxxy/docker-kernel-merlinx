name: Build Docker Kernel

on:
  workflow_dispatch:
  push:
    branches: [ shockwave-docker ]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Clone kernel source
        working-directory: .
        run: |
          git clone --depth=1 https://github.com/Jbub5/android_kernel_xiaomi_mt6768 \
            -b kernel-tree-wip_damon+_shockwave kernel
          cp arch/arm64/configs/merlin_defconfig kernel/arch/arm64/configs/merlin_defconfig
          # Fix MTK vendor broken angle-bracket includes where header is in same dir
          find kernel/drivers kernel/sound -name '*.c' -exec sh -c '
            for cfile; do
              d=$(dirname "$cfile")
              grep -o '"'"'#include <[^>]\+>'"'"' "$cfile" 2>/dev/null | while read -r line; do
                hdr=$(echo "$line" | sed '"'"'s/.*<\(.*\)>.*/\1/'"'"')
                [ -f "$d/$hdr" ] && sed -i "s|#include <$hdr>|#include \"$hdr\"|g" "$cfile"
              done
            done
          ' _ {} + 2>/dev/null || true
          # Add include path for helio-dvfsrc-v2 to find parent devfreq headers
          mkdir -p kernel/drivers/devfreq/helio-dvfsrc-v2
          echo "ccflags-y += -I\$(srctree)/drivers/devfreq" >> \
            kernel/drivers/devfreq/helio-dvfsrc-v2/Makefile 2>/dev/null || true

      - name: Install dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            libssl-dev zip zlib1g-dev libncurses-dev python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi cpio

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Build kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j$(nproc) merlin_defconfig

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            -j$(nproc) 2>&1

      - name: Package AnyKernel3
        working-directory: .
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/arch/arm64/boot/dts/mediatek/*.dtbo AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' anykernel.sh
          zip -r9 ../ShockwaveKernel-Docker.zip * -x .git README.md *placeholder

      - uses: actions/upload-artifact@v4
        with:
          name: ShockwaveKernel-Docker
          path: ShockwaveKernel-Docker.zip
