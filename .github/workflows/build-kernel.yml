name: Build Docker Kernel

on:
  workflow_dispatch:
  push:
    branches: [ shockwave-docker ]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Clone kernel source
        working-directory: .
        run: |
          git clone --depth=1 https://github.com/Jbub5/android_kernel_xiaomi_mt6768 \
            -b kernel-tree-wip_damon+_shockwave kernel
          cp arch/arm64/configs/merlin_defconfig kernel/arch/arm64/configs/merlin_defconfig

      - name: Install dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            libssl-dev zip zlib1g-dev libncurses-dev python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi cpio

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j$(nproc) \
            merlin_defconfig

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            -j$(nproc) 2>&1

      - name: Package AnyKernel3
        working-directory: .
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/arch/arm64/boot/dts/mediatek/*.dtbo AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' anykernel.sh
          zip -r9 ../ShockwaveKernel-Docker.zip * -x .git README.md *placeholder

      - uses: actions/upload-artifact@v4
        with:
          name: ShockwaveKernel-Docker
          path: ShockwaveKernel-Docker.zip
